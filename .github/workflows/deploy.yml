name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
        run: |
          node -e "const url = process.env.SUPABASE_URL || ''; const key = process.env.SUPABASE_ANON_KEY || ''; if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url) || !key || key === '******' || key.includes('your-anon-key')) { console.error('Missing valid Supabase URL or anon key. Configure VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as GitHub Variables or Secrets.'); process.exit(1); }"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}"
          VITE_SUPABASE_ANON_KEY: "${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
          VITE_FORM_ENDPOINT: "${{ vars.VITE_FORM_ENDPOINT }}"
          VITE_FORM_ACCESS_KEY: "${{ vars.VITE_FORM_ACCESS_KEY }}"
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.d.outputs.page_url }}"
    steps:
      - id: d
        uses: actions/deploy-pages@v4
